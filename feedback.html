<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - StudentHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <a href="#main-content">Skip to main content</a>

    <header>
        <h1>StudentHub Northgate</h1>

        <nav aria-label="Main Navigation">
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="dashboard.html">Dashboard</a> |
            <a href="events.html">Events</a> |
            <a href="profile.html">Profile</a> |
            <a href="faq.html">FAQ</a> |
            <a href="contact.html">Contact</a> |
            <a href="feedback.html" aria-current="page">Feedback</a>
        </nav>
    </header>

    <main id="main-content">

        <nav aria-label="Breadcrumb">
            <p>
                <a href="index.html">Home</a> &gt; Feedback
            </p>
        </nav>

        <section>
            <h2>Student Feedback</h2>

            <p>
                Your feedback helps us improve StudentHub.
            </p>

            <form>

                <fieldset>
                    <legend>Basic Information</legend>

                    <p>
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name">
                    </p>

                    <p>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email">
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Rate StudentHub</legend>

                    <p>
                        <label for="rating">Overall Rating:</label>

                        <select id="rating" name="rating">
                            <option value="">Select Rating</option>
                            <option value="5">Excellent</option>
                            <option value="4">Very Good</option>
                            <option value="3">Good</option>
                            <option value="2">Needs Improvement</option>
                            <option value="1">Poor</option>
                        </select>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Your Feedback</legend>

                    <p>
                        <label for="feedback">
                            Tell us about your experience:
                        </label>
                    </p>

                    <p>
                        <textarea id="feedback" name="feedback" rows="7" cols="50" required></textarea>
                    </p>
                </fieldset>

                <p>
                    <button type="submit">Submit Feedback</button>
                    <button type="reset">Clear Form</button>
                </p>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; StudentPortal</p>
    </footer>

</body>

</html>
